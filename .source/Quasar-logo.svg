<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- #015EFB 主题蓝渐变 -->
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2575FC"/>
      <stop offset="50%" stop-color="#015EFB"/>
      <stop offset="100%" stop-color="#003EB3"/>
    </linearGradient>

    <!-- 电光青高光 -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#015EFB"/>
    </linearGradient>

    <!-- 匹配首页 3D 地球质感的径向渐变 -->
    <radialGradient id="planetGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#015EFB" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#002D8B"/>
      <stop offset="100%" stop-color="#020B1E"/>
    </radialGradient>

    <!-- 半透明玻璃光泽环 -->
    <linearGradient id="glassRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#015EFB" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- 深色高对比度文字渐变 -->
    <linearGradient id="textDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- 微发光 filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#015EFB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 左侧 3D 星体/Q 气场图标 -->
  <g transform="translate(120, 110)" filter="url(#subtleShadow)">
    <path d="M -60 -18 A 72 26 0 0 1 60 -18" transform="rotate(-28)" fill="none" stroke="url(#cyanAccent)" stroke-width="4" opacity="0.4" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="48" fill="url(#planetGlow)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.6"/>
    <path d="M -34 -20 A 40 40 0 0 1 20 -38" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="#FFFFFF" opacity="0.9" filter="url(#softGlow)"/>
    <path d="M 64 16 A 74 26 0 0 1 -64 14" transform="rotate(-28)" fill="none" stroke="url(#glassRing)" stroke-width="9" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M 28 26 L 62 60" fill="none" stroke="url(#cyanAccent)" stroke-width="9" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M 28 26 L 62 60" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="68" r="3.5" fill="#00F2FE" filter="url(#softGlow)"/>
  </g>

  <!-- 右侧现代化动态文字标志 -->
  <g transform="translate(240, 68)">
    <text x="0" y="62" font-family="'Noto Sans', sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#textDark)">
      Quasar
    </text>

    <g transform="translate(4, 82)">
      <circle cx="6" cy="8" r="4" fill="#015EFB"/>
      <text x="20" y="12" font-family="'Noto Sans', sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#64748B">
        ASTRO BLOG THEME
      </text>

      <g transform="translate(245, -3)">
        <rect x="0" y="0" width="100" height="22" rx="11" fill="#015EFB" fill-opacity="0.08" stroke="#015EFB" stroke-opacity="0.2" stroke-width="1"/>
        <text x="50" y="14" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="11" font-weight="700" fill="#015EFB" letter-spacing="1">
          1.0.0 Version
        </text>
      </g>
    </g>
  </g>
</svg>
